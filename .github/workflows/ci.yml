name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GOLANGCI_LINT_VERSION: v2.11.4

jobs:
  # Decides which jobs have anything to read. A skipped job (job-level `if`)
  # reports as passing to branch protection, which a workflow-level `paths`
  # filter does not. If this job fails, every job runs.
  #
  # A job missing a file it reads is skipped and reports green, so a stale
  # list below fails silently. When a job starts reading a new kind of file,
  # add it to that job's `decide` line; when unsure, widen. A new job needs an
  # output here, a `decide` line, and the `needs` and `if` pair copied from
  # the jobs below with the output name changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.which.outputs.test }}
      patterns: ${{ steps.which.outputs.patterns }}
      lint: ${{ steps.which.outputs.lint }}
      dogfood: ${{ steps.which.outputs.dogfood }}
      determinism: ${{ steps.which.outputs.determinism }}
      plugin-smoke: ${{ steps.which.outputs.plugin-smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: which
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Single-quoted so the regex backslashes reach grep unchanged. Each
          # piece is one anchored alternative, joined with | below. Go source
          # and module files, the embedded patterns/ tree and this workflow
          # feed every job.
          every='\.go$|^go\.(mod|sum)$|^patterns/|^\.github/workflows/ci\.yml$'
          fixtures='(^|/)testdata/'
          golangci='^\.golangci\.yml$|^\.custom-gcl\.yml$'
          tiger='^tiger\.'
          dogfood='^\.github/(report\.awk|testdata/)'
          # HEAD is the merge of the PR into its base, so this is the PR's own
          # change; --no-renames lists the old path of a moved file too, and
          # quotepath=false keeps non-ASCII names from arriving quoted.
          if [ "$EVENT" = pull_request ]; then
            git -c core.quotepath=false diff --no-renames --name-only "$BASE" HEAD > changed.txt
            cat changed.txt
          fi
          decide() {
            if [ "$EVENT" != pull_request ] || grep -Eq "$2" changed.txt; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          # test also reads docs/ (internal/rules/docs_test.go) and config/
          # (internal/golangci/command_test.go); lint skips testdata because Go does.
          decide test "$every|^docs/|^config/|$fixtures|$golangci|$tiger"
          decide patterns "$every|$tiger"
          decide lint "$every|$golangci"
          decide dogfood "$every|$tiger|$dogfood"
          decide determinism "$every|$tiger|$fixtures"
          decide plugin-smoke "$every|$tiger|$fixtures|$golangci"

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Go's test cache keys on the modification time of the files a test
      # stats, and a fresh checkout stamps every file with the clone time, so
      # internal/check, internal/rules and cmd/tiger would never hit. Each file
      # and directory takes the time of the newest commit that touched it, which
      # stays the same until the file changes. .git takes the newest time too,
      # because tests that walk the repository root hash its listing.
      - name: restore file times from git history
        run: |
          git -c core.quotepath=false log --no-renames --name-only --pretty=format:'@%ct' |
            awk '/^@/ { t = substr($0, 2); next }
                 NF && !($0 in seen) {
                   seen[$0] = 1; print t, $0
                   if (!top) top = t
                   d = $0
                   while (sub(/\/[^\/]*$/, "", d)) if (!(d in dir) || t > dir[d]) dir[d] = t
                 }
                 END { for (d in dir) print dir[d], d; print top, "."; print top, ".git" }' |
            while read -r stamp path; do
              if [ -e "$path" ]; then touch -d "@$stamp" -- "$path"; fi
            done
      # setup-go's own cache is off because it would hand main earlier test
      # results. Main starts empty so it runs every test, then saves; a pull
      # request restores the newest entry (main's, or its own earlier push)
      # and reruns only the packages whose inputs changed.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        if: github.event_name == 'pull_request'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ github.sha }}
          restore-keys: go-test-
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ github.sha }}

  # ADR-0025: a pattern is only worth shipping while it stays true. Every
  # pattern passes tiger check with zero findings and its tests under -race.
  # The patterns' own go test run is separate from the repository-wide one so
  # a failing pattern names itself.
  patterns:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.patterns == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/tiger ./cmd/tiger
      - name: every pattern passes tiger check with zero findings
        run: |
          ./bin/tiger check ./patterns/... > patterns.txt 2>&1 || true
          cat patterns.txt
          test ! -s patterns.txt
      - run: go test -race -count=1 ./patterns/...
      - name: the binary prints a pattern
        run: |
          ./bin/tiger pattern shutdown-loop | grep -q '^## Tests: '
          ./bin/tiger pattern --rule TS-C02 | grep -q shutdown-loop

  # Stage 0 of the adoption ladder, applied to tiger itself.
  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lint == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: golangci
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.mod') }}
      - if: steps.golangci.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - run: golangci-lint run ./...

  # The tiger repository dogfoods itself: the custom rules run over the tree
  # against the committed tiger.budget.yaml, the built binary is published as
  # a workflow artifact, and each pull request gets the report as a sticky
  # comment.
  dogfood:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dogfood == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/tiger ./cmd/tiger
      - uses: actions/upload-artifact@v4
        with:
          name: tiger
          path: bin/tiger
      - name: tiger check
        id: check
        run: |
          set +e
          ./bin/tiger check ./... > report.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.txt
      - name: report summarizer matches its golden
        run: |
          awk -f .github/report.awk .github/testdata/report.txt > got.md
          diff .github/testdata/report.golden.md got.md
      - name: report on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- tiger-check-report -->'
          {
            echo "$marker"
            echo '### `tiger check ./...`'
            echo
            case "$CODE" in
              0) echo 'Exit 0 — no blocking findings.' ;;
              1) echo 'Exit 1 — blocking findings; the dogfood job fails.' ;;
              *) echo "Exit $CODE — operational failure; the dogfood job fails." ;;
            esac
            echo
            awk -f .github/report.awk report.txt
          } > comment.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md
          fi
      - name: fail on findings
        run: test "${{ steps.check.outputs.code }}" -eq 0

  # Correctness constraint 4: the same tree produces byte-identical output
  # across runs — the check runs twice and any diff fails the build (the
  # spec's TS-T11 applied to tiger itself).
  determinism:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.determinism == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: double-run diff on a findings fixture
        run: |
          go build -o bin/tiger ./cmd/tiger
          set +e
          ./bin/tiger check -C internal/check/testdata/fixtures/findings ./... > first.txt
          first=$?
          ./bin/tiger check -C internal/check/testdata/fixtures/findings ./... > second.txt
          second=$?
          set -e
          test "$first" -eq 1
          test "$second" -eq 1
          diff first.txt second.txt
      - name: double-run diff on a layer file fixture
        run: |
          set +e
          ./bin/tiger check -C testdata/plugin-layers ./... > first.txt
          first=$?
          ./bin/tiger check -C testdata/plugin-layers ./... > second.txt
          second=$?
          set -e
          test "$first" -eq 1
          test "$second" -eq 1
          grep -q "TS-X03" first.txt
          diff first.txt second.txt
      - name: double-run diff on the repository tree
        run: |
          ./bin/tiger check ./... > first.txt
          ./bin/tiger check ./... > second.txt
          diff first.txt second.txt
      - name: double-run diff with the facts channel on
        run: |
          ./bin/tiger check --show-facts ./... > first.txt
          ./bin/tiger check --show-facts ./... > second.txt
          diff first.txt second.txt
      # The repository has no unpinned loop left to print, so the fixture is
      # what proves the facts channel prints something to diff.
      - name: double-run diff with the facts channel on a fixture
        run: |
          ./bin/tiger check -C internal/check/testdata/fixtures/showfacts --show-facts ./... > first.txt
          ./bin/tiger check -C internal/check/testdata/fixtures/showfacts --show-facts ./... > second.txt
          diff first.txt second.txt
          test -s first.txt

  # The golangci-lint module plugin registers every analyzer, SSA ones
  # included; a known AST finding and a known SSA finding
  # must surface through a golangci-lint run. Computed facts
  # must not (golangci has no --show-facts channel), and neither may the
  # whole-program rules TS-A07 and TS-A09: the plugin runs no
  # finish step (ADR-0010). The fixture fires both under `tiger
  # check`, which a CLI test asserts, so the silence here is meaningful.
  # The plugin also installs the module's tiger.yaml: a participle.allow
  # entry scoped to ./scoped silences TS-N14 there and leaves the same
  # identifier firing in ./outside.
  plugin-smoke:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.plugin-smoke == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: golangci
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.mod') }}
      - if: steps.golangci.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - run: golangci-lint custom
      - name: known finding surfaces through the plugin
        working-directory: testdata/plugin-smoke
        run: |
          set +e
          ../../bin/tiger-gcl run ./... > findings.txt 2>&1
          code=$?
          set -e
          cat findings.txt
          test "$code" -eq 1
          grep -q "TS-S09" findings.txt
          grep -q "TS-M10" findings.txt
          grep -q "TS-S01" findings.txt
          ! grep -q "TS-V01" findings.txt
          ! grep -q "TS-A07" findings.txt
          ! grep -q "TS-A09" findings.txt
          grep -q "outside/outside.go.*TS-N14" findings.txt
          ! grep -q "scoped/scoped.go" findings.txt
      # The plugin installs the module's tiger.layers.yaml: the import of os
      # that ./layered's entry leaves out and ./unlisted's missing entry
      # surface, and the stale ./gone entry does not, because only tiger
      # check sees the module's directories.
      - name: layer file finding surfaces through the plugin
        working-directory: testdata/plugin-layers
        run: |
          set +e
          ../../bin/tiger-gcl run ./... > findings.txt 2>&1
          code=$?
          set -e
          cat findings.txt
          test "$code" -eq 1
          grep -q "layered/layered.go.*TS-X03" findings.txt
          grep -q "unlisted/unlisted.go.*has no entry" findings.txt
          # A negated grep under set -e does not stop the step when it matches,
          # so each absence check exits explicitly.
          if grep -q "pure/pure.go" findings.txt; then exit 1; fi
          if grep -q "gone" findings.txt; then exit 1; fi
      # Releases ship the tiger binary next to the plugin, because the patterns
      # live in the binary and a plugin-only adopter has no other way to read one.
      - name: the plugin's pattern pointer names a pattern the shipped tiger prints
        run: |
          go build -o bin/tiger ./cmd/tiger
          grep -q 'TS-S01.*see `tiger pattern capped-worklist`' testdata/plugin-smoke/findings.txt
          ./bin/tiger pattern capped-worklist | grep -q '^## Code: '
      - uses: actions/upload-artifact@v4
        with:
          name: tiger-and-plugin
          path: |
            bin/tiger
            bin/tiger-gcl
