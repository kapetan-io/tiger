name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GOLANGCI_LINT_VERSION: v2.11.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Stage 0 of the adoption ladder, applied to tiger itself.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - run: golangci-lint run ./...

  # The tiger repository dogfoods itself: the custom rules run over the tree,
  # the built binary is published as a workflow artifact, and each pull
  # request gets the report as a sticky comment — the one place advisory
  # findings (escapes, skipped tests) stay in front of reviewers, since they
  # never fail the run.
  dogfood:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/tiger ./cmd/tiger
      - uses: actions/upload-artifact@v4
        with:
          name: tiger
          path: bin/tiger
      - name: tiger check
        id: check
        run: |
          set +e
          ./bin/tiger check ./... > report.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.txt
      - name: report on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- tiger-check-report -->'
          {
            echo "$marker"
            echo '### `tiger check ./...`'
            echo
            case "$CODE" in
              0) echo 'Exit 0 — no blocking findings.' ;;
              1) echo 'Exit 1 — blocking findings; the dogfood job fails.' ;;
              *) echo "Exit $CODE — operational failure; the dogfood job fails." ;;
            esac
            echo
            if [ -s report.txt ]; then
              echo '```'
              cat report.txt
              echo '```'
            else
              echo 'Clean run: no findings, no advisories.'
            fi
          } > comment.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md
          fi
      - name: fail on findings
        run: test "${{ steps.check.outputs.code }}" -eq 0

  # Correctness constraint 4: the same tree produces byte-identical output
  # across runs — the check runs twice and any diff fails the build (the
  # spec's TS-T11 applied to tiger itself).
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: double-run diff on a findings fixture
        run: |
          go build -o bin/tiger ./cmd/tiger
          set +e
          ./bin/tiger check -C internal/cli/testdata/fixtures/findings ./... > first.txt
          first=$?
          ./bin/tiger check -C internal/cli/testdata/fixtures/findings ./... > second.txt
          second=$?
          set -e
          test "$first" -eq 1
          test "$second" -eq 1
          diff first.txt second.txt
      - name: double-run diff on the repository tree
        run: |
          ./bin/tiger check ./... > first.txt
          ./bin/tiger check ./... > second.txt
          diff first.txt second.txt

  # The golangci-lint module plugin registers all wave-1 analyzers; one known
  # finding must surface through a golangci-lint run.
  plugin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - run: golangci-lint custom
      - name: known finding surfaces through the plugin
        working-directory: testdata/plugin-smoke
        run: |
          set +e
          ../../bin/tiger-gcl run ./... > findings.txt 2>&1
          code=$?
          set -e
          cat findings.txt
          test "$code" -eq 1
          grep -q "TS-S09" findings.txt
          grep -q "TS-M10" findings.txt
