# Generated by tiger golangci --init from the tiger rule registry.
# Every linter and setting below enforces an auto rule of the Tiger Go
# Specification; tiger golangci audits this file against that baseline.
formatters:
    enable:
        - gci
        - gofumpt
    settings:
        gci:
            sections:
                - standard
                - default
                - prefix(fixture.example/drifted)
        gofumpt:
            extra-rules: true
issues:
    max-issues-per-linter: 0
    max-same-issues: 0
linters:
    default: standard
    enable:
        - containedctx
        - contextcheck
        - cyclop
        - decorder
        - depguard
        - errname
        - errorlint
        - exhaustive
        - exhaustruct
        - forbidigo
        - forcetypeassert
        - funlen
        - gochecknoglobals
        - gochecknoinits
        - gocognit
        - gocritic
        - godot
        - gosec
        - ireturn
        - lll
        - makezero
        - mnd
        - nakedret
        - nestif
        - nilnil
        - noctx
        - nolintlint
        - perfsprint
        - prealloc
        - revive
        - unconvert
        - varnamelen
        - wastedassign
        - wrapcheck
    settings:
        cyclop:
            max-complexity: 10
            package-average: 5.0
        decorder:
            dec-order:
                - const
                - var
                - type
                - func
            disable-dec-order-check: false
            disable-init-func-first-check: false
        errcheck:
            check-blank: true
            check-type-assertions: true
        exhaustive:
            check:
                - switch
                - map
            default-signifies-exhaustive: false
        forbidigo:
            analyze-types: true
            forbid:
                - pattern: ^time\.Sleep$
                - pattern: ^time\.Now$
                - pattern: ^time\.After$
                - pattern: ^panic$
        funlen:
            ignore-comments: true
            lines: 60
            statements: 45
        gocognit:
            min-complexity: 15
        gocritic:
            settings:
                hugeParam:
                    sizeThreshold: 64
                rangeValCopy:
                    sizeThreshold: 64
        godot:
            capital: true
            scope: declarations
        gosec:
            includes:
                - G115
        govet:
            enable-all: true
            settings:
                shadow:
                    strict: true
        ireturn:
            allow:
                - error
                - stdlib
        lll:
            line-length: 100
            tab-width: 4
        mnd:
            checks:
                - argument
                - case
                - condition
                - operation
                - return
                - assign
        nakedret:
            max-func-lines: 0
        nestif:
            min-complexity: 3
        nolintlint:
            allow-unused: false
            require-explanation: true
            require-specific: true
        revive:
            rules:
                - name: var-naming
                - name: exported
                - name: package-comments
        staticcheck:
            checks:
                - all
        varnamelen:
            min-name-length: 3
version: "2"
