<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="TS-C02 goroutine group: before, Launch starts a goroutine with a bare go statement and returns, so nothing waits for it and it can outlive its caller; after, Start launches it with wg.Go and Shutdown closes stop and calls wg.Wait until it exits">
  <title>TS-C02 goroutine group: before, Launch starts a goroutine with a bare go statement and returns, so nothing waits for it and it can outlive its caller; after, Start launches it with wg.Go and Shutdown closes stop and calls wg.Wait until it exits</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; white-space: pre; }
    .small { font-size: 12px; }
    .muted { fill: #656d76; }
    .bold { font-weight: 600; }
    .canvas { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; }
    .codebg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .bad { stroke: #cf222e; stroke-width: 1.8; fill: none; }
    .good { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .badtext { fill: #cf222e; }
    .goodtext { fill: #1a7f37; }
    .badbox { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .goodbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
    .tip-n { fill: #57606a; } .tip-b { fill: #cf222e; } .tip-g { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #8d96a0; }
      .canvas { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; }
      .codebg { fill: #0d1117; stroke: #30363d; }
      .node { fill: #0d1117; stroke: #6e7681; }
      .ghost { stroke: #6e7681; }
      .edge { stroke: #8d96a0; }
      .bad { stroke: #f85149; }
      .good { stroke: #3fb950; }
      .badtext { fill: #f85149; }
      .goodtext { fill: #3fb950; }
      .badbox { fill: #3c1618; stroke: #f85149; }
      .goodbox { fill: #12261e; stroke: #3fb950; }
      .tip-n { fill: #8d96a0; } .tip-b { fill: #f85149; } .tip-g { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-n"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-g"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="799" height="339" rx="8"/>
  <g transform="translate(10,0)"><rect class="panel" x="0" y="10" width="380" height="320" rx="6"/><rect class="badbox" x="12" y="20" width="64" height="22" rx="11"/><text class="bold small badtext" x="44.0" y="35" text-anchor="middle">Before</text><text class="mono bold small" x="86" y="35">TS-C02 · goroutine group</text>
  <rect class="node" x="20" y="70" width="110" height="34" rx="6"/>
  <text class="mono" x="75.0" y="91.0" text-anchor="middle">Launch()</text>
  <rect class="ghost" x="220" y="70" width="130" height="34" rx="6"/>
  <text class="mono" x="285.0" y="91.0" text-anchor="middle">go run()</text>
  <path class="bad" d="M 130 87 L 218 87" marker-end="url(#b)"/>
  <text class="small badtext" x="174" y="78" text-anchor="middle">starts</text>
  <text class="small muted" x="190" y="134" text-anchor="middle">Launch returns; nothing waits for run</text>
  <text class="small badtext" x="190" y="152" text-anchor="middle">the goroutine can outlive its caller</text>
  <rect class="codebg" x="8" y="176" width="364" height="56" rx="5"/>
  <text class="code" xml:space="preserve" x="16" y="194">func Launch() {</text>
  <text class="code" xml:space="preserve" x="16" y="208">    go run()</text>
  <text class="code" xml:space="preserve" x="16" y="222">}</text>
  <text class="small bold badtext" x="190" y="318" text-anchor="middle">TS-C02: this go statement starts a goroutine nobody owns</text></g>
  <g transform="translate(410,0)"><rect class="panel" x="0" y="10" width="380" height="320" rx="6"/><rect class="goodbox" x="12" y="20" width="56" height="22" rx="11"/><text class="bold small goodtext" x="40.0" y="35" text-anchor="middle">After</text><text class="mono bold small" x="78" y="35">TS-C02 · goroutine group</text>
  <rect class="node" x="20" y="56" width="110" height="30" rx="6"/>
  <text class="mono" x="75.0" y="75.0" text-anchor="middle">Start()</text>
  <rect class="node" x="220" y="56" width="130" height="30" rx="6"/>
  <text class="mono" x="285.0" y="75.0" text-anchor="middle">wg.Go(serve)</text>
  <path class="good" d="M 130 71 L 218 71" marker-end="url(#g)"/>
  <rect class="node" x="20" y="100" width="110" height="30" rx="6"/>
  <text class="mono" x="75.0" y="119.0" text-anchor="middle">Shutdown()</text>
  <rect class="node" x="220" y="100" width="130" height="30" rx="6"/>
  <text class="mono" x="285.0" y="119.0" text-anchor="middle">wg.Wait()</text>
  <path class="good" d="M 130 115 L 218 115" marker-end="url(#g)"/>
  <path class="edge" d="M 285 86 L 285 98" marker-end="url(#n)"/>
  <text class="small muted" x="190" y="148" text-anchor="middle">Shutdown closes stop, then waits</text>
  <text class="small goodtext" x="190" y="164" text-anchor="middle">for serve to exit</text>
  <rect class="codebg" x="8" y="176" width="364" height="112" rx="5"/>
  <text class="code" xml:space="preserve" x="16" y="194">func (d *Daemon) Start() {</text>
  <text class="code" xml:space="preserve" x="16" y="208">    d.wg.Go(d.serve)</text>
  <text class="code" xml:space="preserve" x="16" y="222">}</text>
  <text class="code" xml:space="preserve" x="16" y="236">func (d *Daemon) Shutdown() {</text>
  <text class="code" xml:space="preserve" x="16" y="250">    close(d.stop)</text>
  <text class="code" xml:space="preserve" x="16" y="264">    d.wg.Wait()</text>
  <text class="code" xml:space="preserve" x="16" y="278">}</text>
  <text class="small bold goodtext" x="190" y="318" text-anchor="middle">a group starts it and Shutdown waits for it</text></g>
</svg>
