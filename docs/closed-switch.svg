<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="TS-S08 closed switch: before, a switch over Status handles Active and Inactive with no default arm, so a new StatusArchived falls out and returns an empty string with no error; after, golangci-lint&#x27;s exhaustive check reports the missing StatusArchived case, and a default arm that calls assert.Unreachable crashes if the value still arrives at run time">
  <title>TS-S08 closed switch: before, a switch over Status handles Active and Inactive with no default arm, so a new StatusArchived falls out and returns an empty string with no error; after, golangci-lint&#x27;s exhaustive check reports the missing StatusArchived case, and a default arm that calls assert.Unreachable crashes if the value still arrives at run time</title>
  <style>
    svg { --ink: #24292f; --dim: #6a737d; --paper: #ffffff; --well: #f3f4f6; --rim: #d4d8dd;
          --cell: #ffffff; --cellrim: #8a929b; --wire: #57606a;
          --fail: #c4242f; --failfill: #fde8e8; --pass: #1b7a38; --passfill: #def7e5; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e4e8ec; --dim: #99a2ac; --paper: #0e1116; --well: #161b21; --rim: #333a42;
            --cell: #0e1116; --cellrim: #707982; --wire: #99a2ac;
            --fail: #ff6a62; --failfill: #3b1719; --pass: #46c15d; --passfill: #11271b; }
    }
    text { fill: var(--ink); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .src { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; white-space: pre; }
    .s { font-size: 12px; }
    .b { font-weight: 600; }
    .dim { fill: var(--dim); }
    .rf { fill: var(--fail); }
    .rp { fill: var(--pass); }
    .page { fill: var(--paper); stroke: var(--rim); }
    .well { fill: var(--well); }
    .srcbox { fill: var(--paper); stroke: var(--rim); }
    .cell { fill: var(--cell); stroke: var(--cellrim); stroke-width: 1.2; }
    .ghost { fill: none; stroke: var(--cellrim); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .cellfail { fill: var(--failfill); stroke: var(--fail); stroke-width: 1.2; }
    .cellpass { fill: var(--passfill); stroke: var(--pass); stroke-width: 1.2; }
    .wire { fill: none; stroke: var(--wire); stroke-width: 1.5; }
    .wfail { fill: none; stroke: var(--fail); stroke-width: 1.8; }
    .wpass { fill: none; stroke: var(--pass); stroke-width: 2; }
    .tw { fill: var(--wire); } .tf { fill: var(--fail); } .tp { fill: var(--pass); }
  </style>
  <defs>
    <marker id="headWire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tw"/></marker>
    <marker id="headFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tf"/></marker>
    <marker id="headPass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tp"/></marker>
  </defs>
  <rect class="page" x="0.5" y="0.5" width="799" height="359" rx="8"/>
  <g transform="translate(10,0)"><rect class="well" x="0" y="10" width="380" height="340" rx="6"/><rect class="cellfail" x="12" y="20" width="64" height="22" rx="11"/><text class="b s rf" x="44.0" y="35" text-anchor="middle">Before</text><text class="m b s" x="86" y="35">TS-S08 · closed switch</text>
  <rect class="cell" x="20" y="52" width="130" height="28" rx="6"/>
  <text class="m" x="85.0" y="70.0" text-anchor="middle">StatusActive</text>
  <rect class="cell" x="20" y="86" width="130" height="28" rx="6"/>
  <text class="m" x="85.0" y="104.0" text-anchor="middle">StatusInactive</text>
  <rect class="cellfail" x="20" y="120" width="130" height="28" rx="6"/>
  <text class="m" x="85.0" y="138.0" text-anchor="middle">StatusArchived</text>
  <rect class="cell" x="230" y="52" width="130" height="62" rx="6"/>
  <text class="m" x="295.0" y="87.0" text-anchor="middle">switch status</text>
  <path class="wire" d="M 150 66 L 228 76" marker-end="url(#headWire)"/>
  <path class="wire" d="M 150 100 L 228 90" marker-end="url(#headWire)"/>
  <path class="wfail" d="M 150 134 C 190 134, 190 110, 228 102" marker-end="url(#headFail)"/>
  <text class="s rf" x="295" y="134" text-anchor="middle">falls out, returns &quot;&quot;</text>
  <text class="s rf" x="295" y="150" text-anchor="middle">no error anywhere</text>
  <rect class="srcbox" x="8" y="176" width="364" height="112" rx="5"/>
  <text class="src" xml:space="preserve" x="16" y="194">switch status {</text>
  <text class="src" xml:space="preserve" x="16" y="208">case StatusActive:</text>
  <text class="src" xml:space="preserve" x="16" y="222">    return &quot;active&quot;</text>
  <text class="src" xml:space="preserve" x="16" y="236">case StatusInactive:</text>
  <text class="src" xml:space="preserve" x="16" y="250">    return &quot;inactive&quot;</text>
  <text class="src" xml:space="preserve" x="16" y="264">}</text>
  <text class="src" xml:space="preserve" x="16" y="278">return &quot;&quot;</text>
  <text class="s b rf" x="190" y="338" text-anchor="middle">TS-S08: this switch over Status has no default arm</text></g>
  <g transform="translate(410,0)"><rect class="well" x="0" y="10" width="380" height="340" rx="6"/><rect class="cellpass" x="12" y="20" width="56" height="22" rx="11"/><text class="b s rp" x="40.0" y="35" text-anchor="middle">After</text><text class="m b s" x="78" y="35">TS-S08 · closed switch</text>
  <rect class="cell" x="20" y="52" width="130" height="28" rx="6"/>
  <text class="m" x="85.0" y="70.0" text-anchor="middle">StatusActive</text>
  <rect class="cell" x="20" y="86" width="130" height="28" rx="6"/>
  <text class="m" x="85.0" y="104.0" text-anchor="middle">StatusInactive</text>
  <rect class="cellpass" x="20" y="120" width="130" height="28" rx="6"/>
  <text class="m" x="85.0" y="138.0" text-anchor="middle">StatusArchived</text>
  <rect class="cell" x="230" y="52" width="130" height="62" rx="6"/>
  <text class="m" x="295.0" y="87.0" text-anchor="middle">switch status</text>
  <path class="wire" d="M 150 66 L 228 76" marker-end="url(#headWire)"/>
  <path class="wire" d="M 150 100 L 228 90" marker-end="url(#headWire)"/>
  <path class="wpass" d="M 150 134 C 190 134, 190 110, 228 102" marker-end="url(#headPass)"/>
  <text class="s rp" x="295" y="130" text-anchor="middle">lint: missing case</text>
  <text class="s rp" x="295" y="146" text-anchor="middle">run: default crashes</text>
  <rect class="srcbox" x="8" y="176" width="364" height="140" rx="5"/>
  <text class="src" xml:space="preserve" x="16" y="194">switch status {</text>
  <text class="src" xml:space="preserve" x="16" y="208">case StatusActive:</text>
  <text class="src" xml:space="preserve" x="16" y="222">    return &quot;active&quot;</text>
  <text class="src" xml:space="preserve" x="16" y="236">case StatusInactive:</text>
  <text class="src" xml:space="preserve" x="16" y="250">    return &quot;inactive&quot;</text>
  <text class="src" xml:space="preserve" x="16" y="264">default:</text>
  <text class="src" xml:space="preserve" x="16" y="278">    assert.Unreachable(&quot;Status: unhandled value&quot;)</text>
  <text class="src" xml:space="preserve" x="16" y="292">}</text>
  <text class="src" xml:space="preserve" x="16" y="306">return &quot;&quot;</text>
  <text class="s b rp" x="190" y="338" text-anchor="middle">lint reports the case, the default arm is the backstop</text></g>
</svg>
