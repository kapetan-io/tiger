<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="TS-S08 closed switch: before, a switch over Status handles Active and Inactive with no default arm, so a new StatusArchived falls out and returns an empty string; after, a default arm calls assert.Unreachable so the new value crashes loudly">
  <title>TS-S08 closed switch: before, a switch over Status handles Active and Inactive with no default arm, so a new StatusArchived falls out and returns an empty string; after, a default arm calls assert.Unreachable so the new value crashes loudly</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; white-space: pre; }
    .small { font-size: 12px; }
    .muted { fill: #656d76; }
    .bold { font-weight: 600; }
    .canvas { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; }
    .codebg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .bad { stroke: #cf222e; stroke-width: 1.8; fill: none; }
    .good { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .badtext { fill: #cf222e; }
    .goodtext { fill: #1a7f37; }
    .badbox { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .goodbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
    .tip-n { fill: #57606a; } .tip-b { fill: #cf222e; } .tip-g { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #8d96a0; }
      .canvas { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; }
      .codebg { fill: #0d1117; stroke: #30363d; }
      .node { fill: #0d1117; stroke: #6e7681; }
      .ghost { stroke: #6e7681; }
      .edge { stroke: #8d96a0; }
      .bad { stroke: #f85149; }
      .good { stroke: #3fb950; }
      .badtext { fill: #f85149; }
      .goodtext { fill: #3fb950; }
      .badbox { fill: #3c1618; stroke: #f85149; }
      .goodbox { fill: #12261e; stroke: #3fb950; }
      .tip-n { fill: #8d96a0; } .tip-b { fill: #f85149; } .tip-g { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-n"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-g"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="799" height="339" rx="8"/>
  <g transform="translate(10,0)"><rect class="panel" x="0" y="10" width="380" height="320" rx="6"/><rect class="badbox" x="12" y="20" width="64" height="22" rx="11"/><text class="bold small badtext" x="44.0" y="35" text-anchor="middle">Before</text><text class="mono bold small" x="86" y="35">TS-S08 · closed switch</text>
  <rect class="node" x="20" y="60" width="130" height="30" rx="6"/>
  <text class="mono" x="85.0" y="79.0" text-anchor="middle">StatusActive</text>
  <rect class="node" x="20" y="100" width="130" height="30" rx="6"/>
  <text class="mono" x="85.0" y="119.0" text-anchor="middle">StatusInactive</text>
  <rect class="badbox" x="20" y="140" width="130" height="30" rx="6"/>
  <text class="mono" x="85.0" y="159.0" text-anchor="middle">StatusArchived</text>
  <rect class="node" x="230" y="60" width="130" height="70" rx="6"/>
  <text class="mono" x="295.0" y="99.0" text-anchor="middle">switch status</text>
  <path class="edge" d="M 150 75 L 228 85" marker-end="url(#n)"/>
  <path class="edge" d="M 150 115 L 228 105" marker-end="url(#n)"/>
  <path class="bad" d="M 150 155 C 190 155, 190 130, 228 118" marker-end="url(#b)"/>
  <text class="small badtext" x="295" y="150" text-anchor="middle">falls out, returns &quot;&quot;</text>
  <rect class="codebg" x="8" y="176" width="364" height="112" rx="5"/>
  <text class="code" xml:space="preserve" x="16" y="194">switch status {</text>
  <text class="code" xml:space="preserve" x="16" y="208">case StatusActive:</text>
  <text class="code" xml:space="preserve" x="16" y="222">    return &quot;active&quot;</text>
  <text class="code" xml:space="preserve" x="16" y="236">case StatusInactive:</text>
  <text class="code" xml:space="preserve" x="16" y="250">    return &quot;inactive&quot;</text>
  <text class="code" xml:space="preserve" x="16" y="264">}</text>
  <text class="code" xml:space="preserve" x="16" y="278">return &quot;&quot;</text>
  <text class="small bold badtext" x="190" y="318" text-anchor="middle">TS-S08: this switch over Status has no default arm</text></g>
  <g transform="translate(410,0)"><rect class="panel" x="0" y="10" width="380" height="320" rx="6"/><rect class="goodbox" x="12" y="20" width="56" height="22" rx="11"/><text class="bold small goodtext" x="40.0" y="35" text-anchor="middle">After</text><text class="mono bold small" x="78" y="35">TS-S08 · closed switch</text>
  <rect class="node" x="20" y="60" width="130" height="30" rx="6"/>
  <text class="mono" x="85.0" y="79.0" text-anchor="middle">StatusActive</text>
  <rect class="node" x="20" y="100" width="130" height="30" rx="6"/>
  <text class="mono" x="85.0" y="119.0" text-anchor="middle">StatusInactive</text>
  <rect class="goodbox" x="20" y="140" width="130" height="30" rx="6"/>
  <text class="mono" x="85.0" y="159.0" text-anchor="middle">StatusArchived</text>
  <rect class="node" x="230" y="60" width="130" height="70" rx="6"/>
  <text class="mono" x="295.0" y="99.0" text-anchor="middle">switch status</text>
  <path class="edge" d="M 150 75 L 228 85" marker-end="url(#n)"/>
  <path class="edge" d="M 150 115 L 228 105" marker-end="url(#n)"/>
  <path class="good" d="M 150 155 C 190 155, 190 130, 228 118" marker-end="url(#g)"/>
  <text class="small goodtext" x="295" y="150" text-anchor="middle">default: crashes loudly</text>
  <rect class="codebg" x="8" y="176" width="364" height="126" rx="5"/>
  <text class="code" xml:space="preserve" x="16" y="194">switch status {</text>
  <text class="code" xml:space="preserve" x="16" y="208">case StatusActive:</text>
  <text class="code" xml:space="preserve" x="16" y="222">    return &quot;active&quot;</text>
  <text class="code" xml:space="preserve" x="16" y="236">case StatusInactive:</text>
  <text class="code" xml:space="preserve" x="16" y="250">    return &quot;inactive&quot;</text>
  <text class="code" xml:space="preserve" x="16" y="264">default:</text>
  <text class="code" xml:space="preserve" x="16" y="278">    assert.Unreachable(&quot;Status: unhandled value&quot;)</text>
  <text class="code" xml:space="preserve" x="16" y="292">}</text>
  <text class="small bold goodtext" x="190" y="318" text-anchor="middle">a new Status value fails the first test that reaches it</text></g>
</svg>
