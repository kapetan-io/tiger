<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="TS-S01 recursion: before, chase calls itself, so stack depth follows the input and a deep input grows the stack toward 1 GB; after, a loop visits stack[i] and appends its children, counts i up to nodesMax and returns errTooManyNodes if nodes are left">
  <title>TS-S01 recursion: before, chase calls itself, so stack depth follows the input and a deep input grows the stack toward 1 GB; after, a loop visits stack[i] and appends its children, counts i up to nodesMax and returns errTooManyNodes if nodes are left</title>
  <style>
    svg { --ink: #24292f; --dim: #6a737d; --paper: #ffffff; --well: #f3f4f6; --rim: #d4d8dd;
          --cell: #ffffff; --cellrim: #8a929b; --wire: #57606a;
          --fail: #c4242f; --failfill: #fde8e8; --pass: #1b7a38; --passfill: #def7e5; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e4e8ec; --dim: #99a2ac; --paper: #0e1116; --well: #161b21; --rim: #333a42;
            --cell: #0e1116; --cellrim: #707982; --wire: #99a2ac;
            --fail: #ff6a62; --failfill: #3b1719; --pass: #46c15d; --passfill: #11271b; }
    }
    text { fill: var(--ink); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .src { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; white-space: pre; }
    .s { font-size: 12px; }
    .b { font-weight: 600; }
    .dim { fill: var(--dim); }
    .rf { fill: var(--fail); }
    .rp { fill: var(--pass); }
    .page { fill: var(--paper); stroke: var(--rim); }
    .well { fill: var(--well); }
    .srcbox { fill: var(--paper); stroke: var(--rim); }
    .cell { fill: var(--cell); stroke: var(--cellrim); stroke-width: 1.2; }
    .ghost { fill: none; stroke: var(--cellrim); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .cellfail { fill: var(--failfill); stroke: var(--fail); stroke-width: 1.2; }
    .cellpass { fill: var(--passfill); stroke: var(--pass); stroke-width: 1.2; }
    .wire { fill: none; stroke: var(--wire); stroke-width: 1.5; }
    .wfail { fill: none; stroke: var(--fail); stroke-width: 1.8; }
    .wpass { fill: none; stroke: var(--pass); stroke-width: 2; }
    .tw { fill: var(--wire); } .tf { fill: var(--fail); } .tp { fill: var(--pass); }
  </style>
  <defs>
    <marker id="headWire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tw"/></marker>
    <marker id="headFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tf"/></marker>
    <marker id="headPass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tp"/></marker>
  </defs>
  <rect class="page" x="0.5" y="0.5" width="799" height="359" rx="8"/>
  <g transform="translate(10,0)"><rect class="well" x="0" y="10" width="380" height="340" rx="6"/><rect class="cellfail" x="12" y="20" width="64" height="22" rx="11"/><text class="b s rf" x="44.0" y="35" text-anchor="middle">Before</text><text class="m b s" x="86" y="35">TS-S01 · no recursion</text>
  <rect class="cell" x="130" y="70" width="120" height="34" rx="6"/>
  <text class="m" x="190.0" y="91.0" text-anchor="middle">chase(n)</text>
  <path class="wfail" d="M 250 80 C 300 60, 300 114, 250 96" marker-end="url(#headFail)"/>
  <text class="s rf" x="305" y="92" text-anchor="start">calls itself</text>
  <text class="s dim" x="190" y="134" text-anchor="middle">stack depth = depth of the input</text>
  <text class="s rf" x="190" y="152" text-anchor="middle">a deep input grows the stack toward 1 GB</text>
  <rect class="srcbox" x="8" y="176" width="364" height="98" rx="5"/>
  <text class="src" xml:space="preserve" x="16" y="194">func chase(n *Node, visit func(*Node)) {</text>
  <text class="src" xml:space="preserve" x="16" y="208">    visit(n)</text>
  <text class="src" xml:space="preserve" x="16" y="222">    for _, c := range n.Children {</text>
  <text class="src" xml:space="preserve" x="16" y="236">        chase(c, visit)</text>
  <text class="src" xml:space="preserve" x="16" y="250">    }</text>
  <text class="src" xml:space="preserve" x="16" y="264">}</text>
  <text class="s b rf" x="190" y="338" text-anchor="middle">TS-S01: chase → chase is a cycle of calls</text></g>
  <g transform="translate(410,0)"><rect class="well" x="0" y="10" width="380" height="340" rx="6"/><rect class="cellpass" x="12" y="20" width="56" height="22" rx="11"/><text class="b s rp" x="40.0" y="35" text-anchor="middle">After</text><text class="m b s" x="78" y="35">TS-S01 · no recursion</text>
  <rect class="cell" x="20" y="70" width="140" height="34" rx="6"/>
  <text class="m" x="90.0" y="91.0" text-anchor="middle">visit(stack[i])</text>
  <rect class="cell" x="210" y="70" width="140" height="34" rx="6"/>
  <text class="m" x="280.0" y="91.0" text-anchor="middle">append children</text>
  <path class="wire" d="M 160 87 L 208 87" marker-end="url(#headWire)"/>
  <path class="wpass" d="M 280 104 C 280 140, 90 140, 90 106" marker-end="url(#headPass)"/>
  <text class="s rp" x="190" y="152" text-anchor="middle">i++ until i == nodesMax</text>
  <text class="s rp" x="190" y="168" text-anchor="middle">at nodesMax it returns errTooManyNodes</text>
  <rect class="srcbox" x="8" y="176" width="364" height="140" rx="5"/>
  <text class="src" xml:space="preserve" x="16" y="194">stack := []*Node{root}</text>
  <text class="src" xml:space="preserve" x="16" y="208">i := 0</text>
  <text class="src" xml:space="preserve" x="16" y="222">for ; i &lt; len(stack) &amp;&amp; i &lt; nodesMax; i++ {</text>
  <text class="src" xml:space="preserve" x="16" y="236">    visit(stack[i])</text>
  <text class="src" xml:space="preserve" x="16" y="250">    stack = append(stack, stack[i].Children...)</text>
  <text class="src" xml:space="preserve" x="16" y="264">}</text>
  <text class="src" xml:space="preserve" x="16" y="278">if i == nodesMax &amp;&amp; i &lt; len(stack) {</text>
  <text class="src" xml:space="preserve" x="16" y="292">    return errTooManyNodes</text>
  <text class="src" xml:space="preserve" x="16" y="306">}</text>
  <text class="s b rp" x="190" y="338" text-anchor="middle">a capped worklist fails fast instead of eating memory</text></g>
</svg>
