<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="TS-S02 loop bound: before, a for loop runs until converged returns true, so if refine stalls it never ends and reports nothing; after, the loop counts tries up to triesMax and returns errNoConvergence when it runs out">
  <title>TS-S02 loop bound: before, a for loop runs until converged returns true, so if refine stalls it never ends and reports nothing; after, the loop counts tries up to triesMax and returns errNoConvergence when it runs out</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; white-space: pre; }
    .small { font-size: 12px; }
    .muted { fill: #656d76; }
    .bold { font-weight: 600; }
    .canvas { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; }
    .codebg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .bad { stroke: #cf222e; stroke-width: 1.8; fill: none; }
    .good { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .badtext { fill: #cf222e; }
    .goodtext { fill: #1a7f37; }
    .badbox { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .goodbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
    .tip-n { fill: #57606a; } .tip-b { fill: #cf222e; } .tip-g { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #8d96a0; }
      .canvas { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; }
      .codebg { fill: #0d1117; stroke: #30363d; }
      .node { fill: #0d1117; stroke: #6e7681; }
      .ghost { stroke: #6e7681; }
      .edge { stroke: #8d96a0; }
      .bad { stroke: #f85149; }
      .good { stroke: #3fb950; }
      .badtext { fill: #f85149; }
      .goodtext { fill: #3fb950; }
      .badbox { fill: #3c1618; stroke: #f85149; }
      .goodbox { fill: #12261e; stroke: #3fb950; }
      .tip-n { fill: #8d96a0; } .tip-b { fill: #f85149; } .tip-g { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-n"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-g"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="799" height="339" rx="8"/>
  <g transform="translate(10,0)"><rect class="panel" x="0" y="10" width="380" height="320" rx="6"/><rect class="badbox" x="12" y="20" width="64" height="22" rx="11"/><text class="bold small badtext" x="44.0" y="35" text-anchor="middle">Before</text><text class="mono bold small" x="86" y="35">TS-S02 · every loop has an upper bound</text>
  <rect class="node" x="20" y="70" width="150" height="34" rx="6"/>
  <text class="mono" x="95.0" y="91.0" text-anchor="middle">converged(x)?</text>
  <rect class="node" x="220" y="70" width="130" height="34" rx="6"/>
  <text class="mono" x="285.0" y="91.0" text-anchor="middle">x = refine(x)</text>
  <path class="edge" d="M 170 80 L 218 80" marker-end="url(#n)"/>
  <text class="small muted" x="194" y="74" text-anchor="middle">no</text>
  <path class="bad" d="M 285 104 C 285 140, 95 140, 95 106" marker-end="url(#b)"/>
  <text class="small badtext" x="190" y="152" text-anchor="middle">if refine stalls, this never ends</text>
  <text class="small muted" x="190" y="168" text-anchor="middle">and no error says why</text>
  <rect class="codebg" x="8" y="176" width="364" height="98" rx="5"/>
  <text class="code" xml:space="preserve" x="16" y="194">func newton(estimate float64) float64 {</text>
  <text class="code" xml:space="preserve" x="16" y="208">    for !converged(estimate) {</text>
  <text class="code" xml:space="preserve" x="16" y="222">        estimate = refine(estimate)</text>
  <text class="code" xml:space="preserve" x="16" y="236">    }</text>
  <text class="code" xml:space="preserve" x="16" y="250">    return estimate</text>
  <text class="code" xml:space="preserve" x="16" y="264">}</text>
  <text class="small bold badtext" x="190" y="318" text-anchor="middle">TS-S02: tiger can&#x27;t tell how many times this loop runs</text></g>
  <g transform="translate(410,0)"><rect class="panel" x="0" y="10" width="380" height="320" rx="6"/><rect class="goodbox" x="12" y="20" width="56" height="22" rx="11"/><text class="bold small goodtext" x="40.0" y="35" text-anchor="middle">After</text><text class="mono bold small" x="78" y="35">TS-S02 · every loop has an upper bound</text>
  <rect class="node" x="20" y="70" width="110" height="34" rx="6"/>
  <text class="mono" x="75.0" y="91.0" text-anchor="middle">tries&lt;max?</text>
  <rect class="node" x="160" y="70" width="100" height="34" rx="6"/>
  <text class="mono" x="210.0" y="91.0" text-anchor="middle">converged?</text>
  <rect class="node" x="290" y="70" width="80" height="34" rx="6"/>
  <text class="mono" x="330.0" y="91.0" text-anchor="middle">refine</text>
  <path class="good" d="M 130 80 L 158 80" marker-end="url(#g)"/>
  <path class="edge" d="M 260 80 L 288 80" marker-end="url(#n)"/>
  <path class="edge" d="M 330 104 C 330 136, 75 136, 75 106" marker-end="url(#n)"/>
  <text class="small muted" x="190" y="152" text-anchor="middle">at triesMax the loop gives up</text>
  <text class="small goodtext" x="190" y="168" text-anchor="middle">and returns errNoConvergence</text>
  <rect class="codebg" x="8" y="176" width="364" height="112" rx="5"/>
  <text class="code" xml:space="preserve" x="16" y="194">for tries := 0; tries &lt; triesMax; tries++ {</text>
  <text class="code" xml:space="preserve" x="16" y="208">    if converged(estimate) {</text>
  <text class="code" xml:space="preserve" x="16" y="222">        return estimate, nil</text>
  <text class="code" xml:space="preserve" x="16" y="236">    }</text>
  <text class="code" xml:space="preserve" x="16" y="250">    estimate = refine(estimate)</text>
  <text class="code" xml:space="preserve" x="16" y="264">}</text>
  <text class="code" xml:space="preserve" x="16" y="278">return estimate, errNoConvergence</text>
  <text class="small bold goodtext" x="190" y="318" text-anchor="middle">a bound turns a hang into an error</text></g>
</svg>
