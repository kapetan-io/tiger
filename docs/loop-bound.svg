<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="TS-S02 loop bound: before, a for loop runs until converged returns true, so if refine stalls it never ends and reports nothing; after, the loop counts tries up to triesMax and returns errNoConvergence when it runs out">
  <title>TS-S02 loop bound: before, a for loop runs until converged returns true, so if refine stalls it never ends and reports nothing; after, the loop counts tries up to triesMax and returns errNoConvergence when it runs out</title>
  <style>
    svg { --ink: #24292f; --dim: #5d656e; --paper: #ffffff; --well: #f3f4f6; --rim: #d4d8dd;
          --cell: #ffffff; --cellrim: #8a929b; --wire: #57606a;
          --fail: #c4242f; --failfill: #fde8e8; --pass: #1b7a38; --passfill: #def7e5; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e4e8ec; --dim: #99a2ac; --paper: #0e1116; --well: #161b21; --rim: #333a42;
            --cell: #0e1116; --cellrim: #707982; --wire: #99a2ac;
            --fail: #ff6a62; --failfill: #3b1719; --pass: #46c15d; --passfill: #11271b; }
    }
    text { fill: #24292f; fill: var(--ink); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .src { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; white-space: pre; }
    .s { font-size: 12px; }
    .b { font-weight: 600; }
    .dim { fill: #5d656e; fill: var(--dim); }
    .rf { fill: #c4242f; fill: var(--fail); }
    .rp { fill: #1b7a38; fill: var(--pass); }
    .page { fill: #ffffff; fill: var(--paper); stroke: #d4d8dd; stroke: var(--rim); }
    .well { fill: #f3f4f6; fill: var(--well); }
    .srcbox { fill: #ffffff; fill: var(--paper); stroke: #d4d8dd; stroke: var(--rim); }
    .cell { fill: #ffffff; fill: var(--cell); stroke: #8a929b; stroke: var(--cellrim); stroke-width: 1.2; }
    .ghost { fill: none; stroke: #8a929b; stroke: var(--cellrim); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .cellfail { fill: #fde8e8; fill: var(--failfill); stroke: #c4242f; stroke: var(--fail); stroke-width: 1.2; }
    .cellpass { fill: #def7e5; fill: var(--passfill); stroke: #1b7a38; stroke: var(--pass); stroke-width: 1.2; }
    .wire { fill: none; stroke: #57606a; stroke: var(--wire); stroke-width: 1.5; }
    .wfail { fill: none; stroke: #c4242f; stroke: var(--fail); stroke-width: 1.8; }
    .wpass { fill: none; stroke: #1b7a38; stroke: var(--pass); stroke-width: 2; }
    .tw { fill: #57606a; fill: var(--wire); } .tf { fill: #c4242f; fill: var(--fail); } .tp { fill: #1b7a38; fill: var(--pass); }
  </style>
  <defs>
    <marker id="headWire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tw"/></marker>
    <marker id="headFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tf"/></marker>
    <marker id="headPass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tp"/></marker>
  </defs>
  <rect class="page" x="0.5" y="0.5" width="799" height="359" rx="8"/>
  <g transform="translate(10,0)"><rect class="well" x="0" y="10" width="380" height="340" rx="6"/><rect class="cellfail" x="12" y="20" width="64" height="22" rx="11"/><text class="b s rf" x="44.0" y="35" text-anchor="middle">Before</text><text class="m b s" x="86" y="35">TS-S02 · every loop has an upper bound</text>
  <rect class="cell" x="20" y="70" width="150" height="34" rx="6"/>
  <text class="m" x="95.0" y="91.0" text-anchor="middle">converged(x)?</text>
  <rect class="cell" x="220" y="70" width="130" height="34" rx="6"/>
  <text class="m" x="285.0" y="91.0" text-anchor="middle">x = refine(x)</text>
  <path class="wire" d="M 170 80 L 218 80" marker-end="url(#headWire)"/>
  <text class="s dim" x="194" y="74" text-anchor="middle">no</text>
  <path class="wfail" d="M 285 104 C 285 140, 95 140, 95 106" marker-end="url(#headFail)"/>
  <text class="s rf" x="190" y="152" text-anchor="middle">if refine stalls, this never ends</text>
  <text class="s dim" x="190" y="168" text-anchor="middle">and no error says why</text>
  <rect class="srcbox" x="8" y="176" width="364" height="98" rx="5"/>
  <text class="src" xml:space="preserve" x="16" y="194">func newton(estimate float64) float64 {</text>
  <text class="src" xml:space="preserve" x="16" y="208">    for !converged(estimate) {</text>
  <text class="src" xml:space="preserve" x="16" y="222">        estimate = refine(estimate)</text>
  <text class="src" xml:space="preserve" x="16" y="236">    }</text>
  <text class="src" xml:space="preserve" x="16" y="250">    return estimate</text>
  <text class="src" xml:space="preserve" x="16" y="264">}</text>
  <text class="s b rf" x="190" y="338" text-anchor="middle">TS-S02: tiger can&#x27;t tell how many times this loop runs</text></g>
  <g transform="translate(410,0)"><rect class="well" x="0" y="10" width="380" height="340" rx="6"/><rect class="cellpass" x="12" y="20" width="56" height="22" rx="11"/><text class="b s rp" x="40.0" y="35" text-anchor="middle">After</text><text class="m b s" x="78" y="35">TS-S02 · every loop has an upper bound</text>
  <rect class="cell" x="14" y="70" width="136" height="34" rx="6"/>
  <text class="m" x="82.0" y="91.0" text-anchor="middle">tries&lt;triesMax?</text>
  <rect class="cell" x="176" y="70" width="94" height="34" rx="6"/>
  <text class="m" x="223.0" y="91.0" text-anchor="middle">converged?</text>
  <rect class="cell" x="296" y="70" width="70" height="34" rx="6"/>
  <text class="m" x="331.0" y="91.0" text-anchor="middle">refine</text>
  <path class="wpass" d="M 150 80 L 174 80" marker-end="url(#headPass)"/>
  <path class="wire" d="M 270 80 L 294 80" marker-end="url(#headWire)"/>
  <path class="wire" d="M 331 104 C 331 136, 82 136, 82 106" marker-end="url(#headWire)"/>
  <text class="s dim" x="190" y="152" text-anchor="middle">at triesMax the loop gives up</text>
  <text class="s rp" x="190" y="168" text-anchor="middle">and returns errNoConvergence</text>
  <rect class="srcbox" x="8" y="176" width="364" height="112" rx="5"/>
  <text class="src" xml:space="preserve" x="16" y="194">for tries := 0; tries &lt; triesMax; tries++ {</text>
  <text class="src" xml:space="preserve" x="16" y="208">    if converged(estimate) {</text>
  <text class="src" xml:space="preserve" x="16" y="222">        return estimate, nil</text>
  <text class="src" xml:space="preserve" x="16" y="236">    }</text>
  <text class="src" xml:space="preserve" x="16" y="250">    estimate = refine(estimate)</text>
  <text class="src" xml:space="preserve" x="16" y="264">}</text>
  <text class="src" xml:space="preserve" x="16" y="278">return estimate, errNoConvergence</text>
  <text class="s b rp" x="190" y="338" text-anchor="middle">a bound turns a hang into an error</text></g>
</svg>
