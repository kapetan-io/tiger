# tiger.layers.yaml — querator's import graph (TS-X03, TS-D01).
#
# Each key is a package (./dir, or ./dir/... for a subtree). Its list names
# everything the package may import beyond the pure standard library:
#   ./pkg         a package in this module (exact; the import graph)
#   module/path   that import path and every path below it
#   net os database syscall plugin io/ioutil crypto/rand math/rand
#                 the standard library that reaches outside the process
#                 or is nondeterministic; each lifts its whole subtree
# Every other standard library package is always allowed. _test.go files
# are not layered. A package with no key fails tiger check.

.:
  - net
  - ./internal
  - ./proto
  - ./transport
  - github.com/duh-rpc/duh-go
  - github.com/kapetan-io/tackle
  - google.golang.org/protobuf

./cmd/querator:
  - net
  - os
  - syscall
  - .
  - ./daemon
  - ./proto
  - ./transport
  - github.com/duh-rpc/duh-go
  - github.com/kapetan-io/tackle
  - github.com/spf13/cobra
  - google.golang.org/protobuf

./cmd/querator-doc:
  - ./proto
  - github.com/duh-rpc/duh-go
  - github.com/kapetan-io/tackle
  - google.golang.org/protobuf

./cmd/quickstart:
