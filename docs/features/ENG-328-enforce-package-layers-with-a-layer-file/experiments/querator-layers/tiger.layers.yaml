  - ./service
  - ./transport
  - ./transport/auth
  - github.com/duh-rpc/duh-go
  - github.com/kapetan-io/errors
  - github.com/kapetan-io/tackle
  - github.com/prometheus/client_golang
  - golang.org/x/net
  - gopkg.in/yaml.v3

./docs:
